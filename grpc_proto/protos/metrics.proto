syntax = "proto3";
package metrics;

message MetricRequest {
  string name     = 1;
  int64  start_ts = 2;
  int64  end_ts   = 3;
  int32  limit    = 4;  // max points; 0 = unlimited
}

message MetricPoint {
  string              name      = 1;
  double              value     = 2;
  int64               timestamp = 3;
  map<string, string> labels    = 4;
}

message BatchResult {
  int32  accepted = 1;
  int32  rejected = 2;
  string error    = 3;
}

service MetricsService {
  rpc GetMetric     (MetricRequest)        returns (MetricPoint);         // unary
  rpc StreamMetrics (MetricRequest)        returns (stream MetricPoint);  // server stream
  rpc BatchWrite    (stream MetricPoint)   returns (BatchResult);         // client stream
  rpc Monitor       (stream MetricRequest) returns (stream MetricPoint);  // bidi stream
}
